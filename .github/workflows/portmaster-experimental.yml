name: PortMaster experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      RELEASE_VERSION: build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Verify package isolation and launcher
        run: python scripts/make_minimal.py test-portmaster-package --progress
      - name: Build aarch64 experimental package
        run: python scripts/make_minimal.py package-portmaster --progress
      - name: Upload PortMaster package
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/portmaster/Rich4-SDL-PortMaster-${{ env.RELEASE_VERSION }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload PortMaster checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/portmaster/Rich4-SDL-PortMaster-${{ env.RELEASE_VERSION }}.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14
