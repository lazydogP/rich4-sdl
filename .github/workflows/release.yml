name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
          - platform: miyoo-mini
            os: windows-2022
          - platform: macos-universal-development
            os: macos-26
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Prepare Windows host tools
        if: matrix.os == 'windows-2022'
        run: ./scripts/setup-windows-toolchain.ps1 -SkipVerify

      - name: Verify release packaging
        if: matrix.os == 'windows-2022'
        run: python tests/unit/test_package_release.py

      - name: Run tests without original game data
        if: matrix.platform == 'windows-x64'
        run: python scripts/make_minimal.py test-unit test-resource --progress

      - name: Build Windows runtime
        if: matrix.platform == 'windows-x64'
        run: python scripts/make_minimal.py sdl stage-sdl-runtime --progress

      - name: Build Miyoo runtime
        if: matrix.platform == 'miyoo-mini'
        run: python scripts/make_minimal.py miyoo --progress

      - name: Package release
        if: matrix.os == 'windows-2022'
        run: python scripts/package_release.py --platform "${{ matrix.platform }}" --version "$env:RELEASE_VERSION"

      - name: Upload release package
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/release/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksum
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/release/*.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Build and inspect macOS development bundle
        shell: bash
        if: matrix.platform == 'macos-universal-development'
        run: python3 scripts/make_minimal.py test-macos-toolchain package-macos test-macos-package --progress

      - name: Record original-resource acceptance availability
        shell: bash
        if: matrix.platform == 'macos-universal-development'
        run: python3 scripts/make_minimal.py test-macos-original --progress

      # Deliberately excluded from the public Windows and Miyoo release downloads.
      # Desktop/listening acceptance and Developer ID notarization are still pending.
      - name: Upload macOS development bundle
        if: matrix.platform == 'macos-universal-development'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/release/Rich4-SDL-macOS-${{ env.RELEASE_VERSION }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS development checksum
        if: matrix.platform == 'macos-universal-development'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: build/release/Rich4-SDL-macOS-${{ env.RELEASE_VERSION }}.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Rich4-SDL-Windows-x64-*.zip
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Download Windows checksum
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Rich4-SDL-Windows-x64-*.zip.sha256
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Download MiyooMini package
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Rich4-SDL-MiyooMini-*.zip
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Download MiyooMini checksum
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Rich4-SDL-MiyooMini-*.zip.sha256
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Publish release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.zip)
          checksums=(*.zip.sha256)
          test "${#archives[@]}" -eq 2
          test "${#checksums[@]}" -eq 2
          test -f "Rich4-SDL-Windows-x64-${RELEASE_TAG}.zip"
          test -f "Rich4-SDL-Windows-x64-${RELEASE_TAG}.zip.sha256"
          test -f "Rich4-SDL-MiyooMini-${RELEASE_TAG}.zip"
          test -f "Rich4-SDL-MiyooMini-${RELEASE_TAG}.zip.sha256"
          sha256sum --check -- "${checksums[@]}"
          cat > notes.txt <<'EOF'
          Windows x64 portable runtime and Miyoo Mini / Mini Plus program update.

          Packages exclude original game data, music, fonts, saves and personal settings.
          Supply legally obtained MKF files and a CJK font as described in each package's README.txt.
          The Miyoo update requires an existing installation with its runtime libraries and font.
          macOS Universal 2 (arm64 + x86_64) is available only as a development CI artifact until real-resource desktop,
          listening, clean-system, Developer ID and notarization acceptance is complete.
          EOF
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes --notes-file notes.txt "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" --clobber -- "${archives[@]}" "${checksums[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
