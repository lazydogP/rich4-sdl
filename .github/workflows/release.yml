name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2022
            package-dir: build/release
          - platform: miyoo-mini
            os: windows-2022
            package-dir: build/release
          - platform: macos-universal-development
            os: macos-26
            package-dir: build/release
          - platform: portmaster-aarch64
            os: ubuntu-22.04
            package-dir: build/portmaster
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Prepare Windows host tools
        if: matrix.os == 'windows-2022'
        run: ./scripts/setup-windows-toolchain.ps1 -SkipVerify

      - name: Verify release packaging
        if: matrix.os == 'windows-2022'
        run: python scripts/make_minimal.py test-package-release test-miyoo-toolchain --progress

      - name: Run tests without original game data
        if: matrix.platform == 'windows-x64'
        run: python scripts/make_minimal.py test-unit test-resource --progress

      - name: Build Windows runtime
        if: matrix.platform == 'windows-x64'
        run: python scripts/make_minimal.py sdl stage-sdl-runtime --progress

      - name: Build Miyoo runtime with Tremor SDL_mixer
        if: matrix.platform == 'miyoo-mini'
        run: python scripts/make_minimal.py miyoo --progress

      - name: Package release
        if: matrix.os == 'windows-2022'
        run: python scripts/package_release.py --platform "${{ matrix.platform }}" --version "$env:RELEASE_VERSION"

      - name: Build and inspect macOS development bundle
        shell: bash
        if: matrix.platform == 'macos-universal-development'
        run: python3 scripts/make_minimal.py test-macos-toolchain package-macos test-macos-package --progress

      - name: Record original-resource acceptance availability
        shell: bash
        if: matrix.platform == 'macos-universal-development'
        run: python3 scripts/make_minimal.py test-macos-original --progress

      - name: Verify PortMaster package isolation and launcher
        shell: bash
        if: matrix.platform == 'portmaster-aarch64'
        run: python scripts/make_minimal.py test-portmaster-package --progress

      - name: Build PortMaster aarch64 experimental package
        shell: bash
        if: matrix.platform == 'portmaster-aarch64'
        run: python scripts/make_minimal.py package-portmaster --progress

      - name: Upload release package
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ matrix.package-dir }}/Rich4-SDL-*-${{ env.RELEASE_VERSION }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload release checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ matrix.package-dir }}/Rich4-SDL-*-${{ env.RELEASE_VERSION }}.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Rich4-SDL-*-${{ github.ref_name }}.zip
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Download release checksums
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: Rich4-SDL-*-${{ github.ref_name }}.zip.sha256
          merge-multiple: true
          skip-decompress: true
          path: dist

      - name: Publish release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          platforms=(Windows-x64 MiyooMini PortMaster macOS)
          archives=(*.zip)
          checksums=(*.zip.sha256)
          test "${#archives[@]}" -eq "${#platforms[@]}"
          test "${#checksums[@]}" -eq "${#platforms[@]}"
          for platform in "${platforms[@]}"; do
            test -f "Rich4-SDL-${platform}-${RELEASE_TAG}.zip"
            test -f "Rich4-SDL-${platform}-${RELEASE_TAG}.zip.sha256"
          done
          sha256sum --check -- "${checksums[@]}"
          cat > notes.txt <<'EOF'
          Windows x64 portable runtime, Miyoo Mini / Mini Plus complete runtime,
          macOS Universal 2 development bundle and PortMaster aarch64 experimental package.

          Packages exclude original game data, music, fonts, saves and personal settings.
          Supply legally obtained MKF files and a CJK font as described in the platform documentation.
          The Miyoo package includes Tremor SDL_mixer, MP3/libmad, SDL_ttf, FreeType and their dependencies.
          Supply game data and a CJK font; OGG music is supported directly without conversion.
          macOS Universal 2 (arm64 + x86_64) uses ad-hoc signing; Developer ID signing and notarization are not included.
          Real-resource desktop, listening and clean-system acceptance are still pending.
          PortMaster is an experimental aarch64 package; handheld firmware acceptance is still pending.
          EOF
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --generate-notes --notes-file notes.txt "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" --clobber -- "${archives[@]}" "${checksums[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
